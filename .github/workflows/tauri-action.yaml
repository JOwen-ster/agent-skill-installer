name: "publish"

on:
  push:
    branches:
      - release

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Adjust if your version lives somewhere else (e.g. package.json only)
          version=$(jq -r '.version // empty' src-tauri/tauri.conf.json)
          if [ -z "$version" ]; then
            version=$(jq -r .version package.json)
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Create the draft release once, up front, so build jobs don't race
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Agent Skill Installer $tag" \
              --notes "No installers: Windows is a standalone .exe, macOS is a zipped .app (unzip and run), Linux is an AppImage."
          fi

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            arch: "arm64"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            arch: "x64"
          - platform: "ubuntu-24.04"
            target: ""
          - platform: "windows-latest"
            target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      # ---------- Windows: standalone exe, no installer ----------
      - name: Build standalone exe (Windows)
        if: runner.os == 'Windows'
        run: bun run tauri build --no-bundle

      - name: Upload exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          exe=$(ls src-tauri/target/release/*.exe | head -n 1)
          echo "Found exe: $exe"
          mkdir -p dist
          out="dist/AgentSkillInstaller-${tag}-windows-x64.exe"
          cp "$exe" "$out"
          gh release upload "$tag" "$out" --clobber

      # ---------- macOS: zipped .app, no DMG ----------
      - name: Build .app (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: bun run tauri build --target ${{ matrix.target }} --bundles app

      - name: Zip and upload .app (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app=$(ls -d "$dir"/*.app | head -n 1)
          echo "Found app: $app"
          mkdir -p dist
          out="dist/AgentSkillInstaller-${tag}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$out"
          gh release upload "$tag" "$out" --clobber

      # ---------- Linux: AppImage only ----------
      - name: Build AppImage and upload (Linux)
        if: runner.os == 'Linux'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tagName: v__VERSION__
          releaseName: "Agent Skill Installer v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: --bundles appimage
